name: Publish verified Magma IPA
on: workflow_dispatch

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: PrismaCubic-Magma-driver-test
          run-id: 45444268762
          github-token: ${{ github.token }}
          path: package
      - name: Verify the device-tested bytes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: magma-entity-fix-2026-11-24
          PACKAGE_SOURCE: a6e6f484f714aa69e4c0d90058eb155649fcf6b3
        run: |
          set -euo pipefail
          mv package/PrismaCubic-Magma-driver-test.ipa PrismaCubic-Magma-Entity-Fix.ipa
          echo '1a3ffc974b6e3ffbb24bfed85aa8bcc81167260e9f888e1f0ce987dc7fdfc3de  PrismaCubic-Magma-Entity-Fix.ipa' | sha256sum --check
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$PACKAGE_SOURCE" --title 'Magma entity rendering fix · iOS test build' --prerelease --latest=false --draft --notes-file .github/magma-release-notes.md
          fi
          existing=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="PrismaCubic-Magma-Entity-Fix.ipa") | .digest')
          if [ -z "$existing" ]; then
            gh release upload "$TAG" PrismaCubic-Magma-Entity-Fix.ipa
          fi
          digest=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="PrismaCubic-Magma-Entity-Fix.ipa") | .digest')
          test "$digest" = 'sha256:1a3ffc974b6e3ffbb24bfed85aa8bcc81167260e9f888e1f0ce987dc7fdfc3de'
          gh release edit "$TAG" --draft=false --prerelease --latest=false
