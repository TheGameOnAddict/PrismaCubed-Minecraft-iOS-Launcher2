name: Native launcher iPhone test IPA
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  APP_REVISION: e5dd5d41d95d2c9df45d5240caade6ef0a5af83d

jobs:
  build:
    name: Build and verify iPhone launcher
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Check out test packaging helper
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/test_ipa_entitlements.py
          persist-credentials: false
      - name: Check out exact launcher source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_REVISION }}
          path: source
          persist-credentials: false
      - name: Set up Java 8 for the shared launcher classpath
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build the launcher jar shared by all game JREs
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/javac" -version
          python3 scripts/test_capture_sampler.py
          make -C JavaApp -j2 BOOTJDK="$JAVA_HOME/bin" build/launcher.jar
          python3 - <<'PYJ'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile(Path("JavaApp/build/launcher.jar")) as z:
              assert z.testzip() is None
              sampler = "net/kdt/pojavlaunch/CaptureSampler.class"
              entry = z.read("net/kdt/pojavlaunch/PojavLauncher.class")
              assert b"net/kdt/pojavlaunch/CaptureSampler" in entry
              assert b"prismacubic.diagnostics.capture" in entry
              for k in (sampler, "net/kdt/pojavlaunch/PojavLauncher.class"):
                  cls = z.read(k)
                  assert cls[:4] == bytes.fromhex("CAFEBABE") and int.from_bytes(cls[6:8], "big") == 52
          PYJ
      - name: Build production arm64 launcher target
        working-directory: source
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_REVISION"
          cc -std=c11 -Wall -Wextra -Werror scripts/test_render_benchmark.c -o "$RUNNER_TEMP/test-render-benchmark"
          "$RUNNER_TEMP/test-render-benchmark"
          cc -std=c11 -O2 -pthread -Wall -Wextra -Werror scripts/test_gameplay_presentation.c -o "$RUNNER_TEMP/test_gameplay_presentation"
          "$RUNNER_TEMP/test_gameplay_presentation"
          python3 scripts/test_render_park.py
          cc -std=c11 -pthread scripts/test_performance_frames.c -o "$RUNNER_TEMP/test-performance-frames"
          "$RUNNER_TEMP/test-performance-frames"
          cc -std=c11 -Wall -Wextra -Werror scripts/test_hotspot_pauses.c -o "$RUNNER_TEMP/test-hotspot-pauses"
          "$RUNNER_TEMP/test-hotspot-pauses"
          clang -fobjc-arc -framework Foundation -framework CoreFoundation -I Natives scripts/test_hitch_report.m Natives/CubicHitchReport.m -o "$RUNNER_TEMP/test-hitch-report"
          "$RUNNER_TEMP/test-hitch-report"
          git submodule update --init --depth 1 --jobs 2 Natives/external/AFNetworking Natives/external/ZeroTierFramework
          sdk_xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          if [ -d "$sdk_xcode" ]; then export DEVELOPER_DIR="$sdk_xcode/Contents/Developer"; fi
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          cmake -S Natives -B Natives/build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CROSSCOMPILING=true -DCMAKE_SYSTEM_NAME=Darwin -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_SYSROOT="$sdk" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_C_FLAGS="-arch arm64" -DCONFIG_BRANCH=feature/gameplay-fps-and-upscaling \
            -DCONFIG_COMMIT="${APP_REVISION:0:7}" -DCONFIG_RELEASE=0
          cmake --build Natives/build --config Debug --target AngelAuraAmethyst --parallel "$(sysctl -n hw.logicalcpu)"
          exe=Natives/build/AngelAuraAmethyst.app/AngelAuraAmethyst
          lipo "$exe" -verify_arch arm64
          otool -L "$exe"
          python3 - "$exe" <<'PY'
          from pathlib import Path
          import sys
          assert b'e5dd5d4' in Path(sys.argv[1]).read_bytes()
          PY
      - name: Save native executable for packaging retries
        uses: actions/upload-artifact@v4
        with:
          name: prisma-launcher-e5dd5d4
          path: source/Natives/build/AngelAuraAmethyst.app/AngelAuraAmethyst
      - name: Download last complete app payload
        uses: actions/download-artifact@v4
        with:
          name: PrismaCubic-ed583a1-iPhone
          run-id: 45676977215
          github-token: ${{ github.token }}
          path: baseline
      - name: Sign and verify launcher against phone-tested build
        shell: bash
        run: |
          set -euo pipefail
          archive=(baseline/*.ipa)
          test "${#archive[@]}" = 1
          base="$GITHUB_WORKSPACE/${archive[0]}"
          expected=326809c2f2d662952a74bad6e21faf69052fe7d9b9f7d89caa8d6235767b64e7
          test "$(shasum -a 256 "$base" | cut -d ' ' -f1)" = "$expected"
          mkdir -p "$RUNNER_TEMP/repacked" result
          ditto -x -k "$base" "$RUNNER_TEMP/repacked"
          cd "$RUNNER_TEMP/repacked"
          app=Payload/AngelAuraAmethyst.app
          exe="$app/AngelAuraAmethyst"
          driver="$app/Frameworks/libMobileGL.dylib"
          helper="$GITHUB_WORKSPACE/scripts/test_ipa_entitlements.py"
          python3 "$helper" "$exe" "$RUNNER_TEMP/entitlements.plist"
          otool -L "$exe" | tail -n+2 | awk '{print $1}' | sort > "$RUNNER_TEMP/baseline.linkage"
          cp "$GITHUB_WORKSPACE/source/Natives/build/AngelAuraAmethyst.app/AngelAuraAmethyst" "$exe"
          chmod +x "$exe"
          otool -L "$exe" | tail -n+2 | awk '{print $1}' | sort > "$RUNNER_TEMP/current.linkage"
          diff -u "$RUNNER_TEMP/baseline.linkage" "$RUNNER_TEMP/current.linkage"
          codesign --verify --verbose "$driver"
          files=("$exe" "$app/_CodeSignature")
          cp "$GITHUB_WORKSPACE/source/JavaApp/build/launcher.jar" "$app/libs/launcher.jar"
          files+=("$app/libs/launcher.jar")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/de.lproj/Localizable.strings" "$app/de.lproj/Localizable.strings"
          files+=("$app/de.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/en.lproj/Localizable.strings" "$app/en.lproj/Localizable.strings"
          files+=("$app/en.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/en.lproj/help-faq.json" "$app/en.lproj/help-faq.json"
          files+=("$app/en.lproj/help-faq.json")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/es.lproj/Localizable.strings" "$app/es.lproj/Localizable.strings"
          files+=("$app/es.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/fr.lproj/Localizable.strings" "$app/fr.lproj/Localizable.strings"
          files+=("$app/fr.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/help-faq.json" "$app/help-faq.json"
          files+=("$app/help-faq.json")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/it.lproj/Localizable.strings" "$app/it.lproj/Localizable.strings"
          files+=("$app/it.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/ja.lproj/Localizable.strings" "$app/ja.lproj/Localizable.strings"
          files+=("$app/ja.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/km.lproj/Localizable.strings" "$app/km.lproj/Localizable.strings"
          files+=("$app/km.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/ko.lproj/Localizable.strings" "$app/ko.lproj/Localizable.strings"
          files+=("$app/ko.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/pt-BR.lproj/Localizable.strings" "$app/pt-BR.lproj/Localizable.strings"
          files+=("$app/pt-BR.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/ru.lproj/Localizable.strings" "$app/ru.lproj/Localizable.strings"
          files+=("$app/ru.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/zh-CN.lproj/Localizable.strings" "$app/zh-CN.lproj/Localizable.strings"
          files+=("$app/zh-CN.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/zh-CN.lproj/help-faq.json" "$app/zh-CN.lproj/help-faq.json"
          files+=("$app/zh-CN.lproj/help-faq.json")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/zh-Hans.lproj/Localizable.strings" "$app/zh-Hans.lproj/Localizable.strings"
          files+=("$app/zh-Hans.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/zh-Hant.lproj/Localizable.strings" "$app/zh-Hant.lproj/Localizable.strings"
          files+=("$app/zh-Hant.lproj/Localizable.strings")
          cp "$GITHUB_WORKSPACE/source/Natives/resources/zh-Hant.lproj/help-faq.json" "$app/zh-Hant.lproj/help-faq.json"
          files+=("$app/zh-Hant.lproj/help-faq.json")
          codesign --force --sign - --timestamp=none --entitlements "$RUNNER_TEMP/entitlements.plist" "$app"
          codesign --verify --verbose "$app"
          python3 "$helper" "$exe" "$RUNNER_TEMP/final.plist"
          cmp "$RUNNER_TEMP/entitlements.plist" "$RUNNER_TEMP/final.plist"
          dest="$GITHUB_WORKSPACE/result"
          zip -qry "$dest/PrismaCubic-e5dd5d4.ipa" Payload
          zip -qry "$dest/signed-overlay.zip" "${files[@]}"
          python3 - "$dest/PrismaCubic-e5dd5d4.ipa" "$base" "$dest/signed-overlay.zip" <<'PY'
          from pathlib import Path
          import hashlib, io, os, sys, zipfile
          out, baseline, overlay = map(Path, sys.argv[1:])
          with zipfile.ZipFile(out) as a, zipfile.ZipFile(baseline) as b, zipfile.ZipFile(overlay) as o:
              ignored = set(o.namelist())
              indexed = lambda z: {i.filename:(i.file_size,i.CRC) for i in z.infolist() if not i.is_dir() and i.filename not in ignored}
              assert indexed(a) == indexed(b)
              for name in ignored:
                  if not name.endswith('/'): assert a.read(name) == o.read(name)
              driver = 'Payload/AngelAuraAmethyst.app/Frameworks/libMobileGL.dylib'
              assert a.read(driver) == b.read(driver)
              jar = 'Payload/AngelAuraAmethyst.app/libs/launcher.jar'
              assert a.read(jar) == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/JavaApp/build/launcher.jar").read_bytes()
              with zipfile.ZipFile(io.BytesIO(a.read(jar))) as new, zipfile.ZipFile(io.BytesIO(b.read(jar))) as old:
                  classes = lambda z: {i.filename for i in z.infolist() if i.filename.endswith(".class")}
                  assert classes(old).issubset(classes(new))
                  name = "net/kdt/pojavlaunch/PojavLauncher.class"
                  assert new.read(name) != old.read(name)
                  assert b"[PojavLauncher] Game frame limit=" in new.read(name)
                  assert int.from_bytes(new.read(name)[6:8], "big") == 52
              assert a.read("Payload/AngelAuraAmethyst.app/de.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/de.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/en.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/en.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/en.lproj/help-faq.json") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/en.lproj/help-faq.json").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/es.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/es.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/fr.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/fr.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/help-faq.json") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/help-faq.json").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/it.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/it.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/ja.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/ja.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/km.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/km.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/ko.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/ko.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/pt-BR.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/pt-BR.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/ru.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/ru.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/zh-CN.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/zh-CN.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/zh-CN.lproj/help-faq.json") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/zh-CN.lproj/help-faq.json").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/zh-Hans.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/zh-Hans.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/zh-Hant.lproj/Localizable.strings") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/zh-Hant.lproj/Localizable.strings").read_bytes()
              assert a.read("Payload/AngelAuraAmethyst.app/zh-Hant.lproj/help-faq.json") == (Path(os.environ["GITHUB_WORKSPACE"]) / "source/Natives/resources/zh-Hant.lproj/help-faq.json").read_bytes()
              assert b'Ordered texture upload deferred: an earlier draw is still pending' in a.read(driver)
              assert b'e5dd5d4' in a.read('Payload/AngelAuraAmethyst.app/AngelAuraAmethyst')
              exe = a.read('Payload/AngelAuraAmethyst.app/AngelAuraAmethyst')
              for stamp in (b'prisma.perf.benchmark', b'prisma.perf.benchmark_description', b'glClientWaitSync', b'preference.title.cap_at_120_fps', b'prisma.upscaling.output_resolution', b'game.stats.render_present'):
                  assert stamp in exe, stamp
              for locale in ('en', 'zh-Hans', 'zh-Hant'):
                  localized = a.read(f'Payload/AngelAuraAmethyst.app/{locale}.lproj/Localizable.strings')
                  for key in (b'prisma.perf.benchmark', b'prisma.perf.benchmark_description', b'prisma.perf.benchmark_rate'):
                      assert key in localized
              with zipfile.ZipFile(io.BytesIO(a.read(jar))) as launcher:
                  sampler = launcher.read('net/kdt/pojavlaunch/CaptureSampler.class')
                  assert b'c2me-storage' in sampler and b'graphics-buffer-upload' in sampler
          for path in (out,overlay):
              print(path.name,hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PrismaCubic-e5dd5d4-iPhone
          path: result/PrismaCubic-e5dd5d4.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PrismaCubic-e5dd5d4-signed-overlay
          path: result/signed-overlay.zip
          if-no-files-found: error
