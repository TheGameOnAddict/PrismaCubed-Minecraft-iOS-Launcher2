name: Native launcher iPhone test IPA
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  APP_REVISION: f3bcab1d1e11665c05b52cf9f3e73696e3a24319

jobs:
  build:
    name: Build and verify iPhone launcher
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Check out test packaging helper
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/test_ipa_entitlements.py
          persist-credentials: false
      - name: Check out exact launcher source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_REVISION }}
          path: source
          persist-credentials: false
      - name: Set up Java 8 for the shared launcher classpath
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build the iOS GLFW bridges
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          make -C JavaApp -j2 BOOTJDK="$JAVA_HOME/bin" build/lwjgl-333.jar build/lwjgl-341.jar
      - name: Build production arm64 launcher target
        working-directory: source
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_REVISION"
          cc -std=c11 -Wall -Wextra -Werror scripts/test_render_benchmark.c -o "$RUNNER_TEMP/test-render-benchmark"
          "$RUNNER_TEMP/test-render-benchmark"
          cc -std=c11 -O2 -pthread -Wall -Wextra -Werror scripts/test_gameplay_presentation.c -o "$RUNNER_TEMP/test_gameplay_presentation"
          "$RUNNER_TEMP/test_gameplay_presentation"
          python3 scripts/test_render_park.py
          cc -std=c11 -pthread scripts/test_performance_frames.c -o "$RUNNER_TEMP/test-performance-frames"
          "$RUNNER_TEMP/test-performance-frames"
          cc -std=c11 -Wall -Wextra -Werror scripts/test_hotspot_pauses.c -o "$RUNNER_TEMP/test-hotspot-pauses"
          "$RUNNER_TEMP/test-hotspot-pauses"
          clang -fobjc-arc -framework Foundation -framework CoreFoundation -I Natives scripts/test_hitch_report.m Natives/CubicHitchReport.m -o "$RUNNER_TEMP/test-hitch-report"
          "$RUNNER_TEMP/test-hitch-report"
          git submodule update --init --depth 1 --jobs 2 Natives/external/AFNetworking Natives/external/ZeroTierFramework
          sdk_xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          if [ -d "$sdk_xcode" ]; then export DEVELOPER_DIR="$sdk_xcode/Contents/Developer"; fi
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          cmake -S Natives -B Natives/build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CROSSCOMPILING=true -DCMAKE_SYSTEM_NAME=Darwin -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_SYSROOT="$sdk" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_C_FLAGS="-arch arm64" -DCONFIG_BRANCH=fix/forge-context-version \
            -DCONFIG_COMMIT="${APP_REVISION:0:7}" -DCONFIG_RELEASE=0
          cmake --build Natives/build --config Debug --target AngelAuraAmethyst --parallel "$(sysctl -n hw.logicalcpu)"
          exe=Natives/build/AngelAuraAmethyst.app/AngelAuraAmethyst
          lipo "$exe" -verify_arch arm64
          otool -L "$exe"
          python3 - "$exe" <<'PY'
          from pathlib import Path
          import sys
          assert b'f3bcab1' in Path(sys.argv[1]).read_bytes()
          PY
      - name: Save native executable for packaging retries
        uses: actions/upload-artifact@v4
        with:
          name: prisma-launcher-f3bcab1
          path: source/Natives/build/AngelAuraAmethyst.app/AngelAuraAmethyst
      - name: Download last complete app payload
        uses: actions/download-artifact@v4
        with:
          name: PrismaCubic-e5dd5d4-iPhone
          run-id: 45681221563
          github-token: ${{ github.token }}
          path: baseline
      - name: Sign and verify launcher against phone-tested build
        shell: bash
        run: |
          set -euo pipefail
          archive=(baseline/*.ipa)
          test "${#archive[@]}" = 1
          base="$GITHUB_WORKSPACE/${archive[0]}"
          expected=8fa353046a0f0351f34b6823c15ed95e15cde3ffb58cf06000a7a9bd9900e93c
          test "$(shasum -a 256 "$base" | cut -d ' ' -f1)" = "$expected"
          mkdir -p "$RUNNER_TEMP/repacked" result
          ditto -x -k "$base" "$RUNNER_TEMP/repacked"
          cd "$RUNNER_TEMP/repacked"
          app=Payload/AngelAuraAmethyst.app
          exe="$app/AngelAuraAmethyst"
          driver="$app/Frameworks/libMobileGL.dylib"
          helper="$GITHUB_WORKSPACE/scripts/test_ipa_entitlements.py"
          python3 "$helper" "$exe" "$RUNNER_TEMP/entitlements.plist"
          otool -L "$exe" | tail -n+2 | awk '{print $1}' | sort > "$RUNNER_TEMP/baseline.linkage"
          cp "$GITHUB_WORKSPACE/source/Natives/build/AngelAuraAmethyst.app/AngelAuraAmethyst" "$exe"
          chmod +x "$exe"
          otool -L "$exe" | tail -n+2 | awk '{print $1}' | sort > "$RUNNER_TEMP/current.linkage"
          diff -u "$RUNNER_TEMP/baseline.linkage" "$RUNNER_TEMP/current.linkage"
          codesign --verify --verbose "$driver"
          files=("$exe" "$app/_CodeSignature")
          for version in 333 341; do
            jarPath="$app/libs/lwjgl-$version/lwjgl.jar"
            cp "$GITHUB_WORKSPACE/source/JavaApp/build/lwjgl-$version.jar" "$jarPath"
            files+=("$jarPath")
          done
          codesign --force --sign - --timestamp=none --entitlements "$RUNNER_TEMP/entitlements.plist" "$app"
          codesign --verify --verbose "$app"
          python3 "$helper" "$exe" "$RUNNER_TEMP/final.plist"
          cmp "$RUNNER_TEMP/entitlements.plist" "$RUNNER_TEMP/final.plist"
          dest="$GITHUB_WORKSPACE/result"
          zip -qry "$dest/PrismaCubic-f3bcab1.ipa" Payload
          zip -qry "$dest/signed-overlay.zip" "${files[@]}"
          python3 - "$dest/PrismaCubic-f3bcab1.ipa" "$base" "$dest/signed-overlay.zip" <<'PY'
          from pathlib import Path
          import hashlib, io, os, sys, zipfile
          out, baseline, overlay = map(Path, sys.argv[1:])
          with zipfile.ZipFile(out) as a, zipfile.ZipFile(baseline) as b, zipfile.ZipFile(overlay) as o:
              ignored = set(o.namelist())
              indexed = lambda z: {i.filename:(i.file_size,i.CRC) for i in z.infolist() if not i.is_dir() and i.filename not in ignored}
              assert indexed(a) == indexed(b)
              for name in ignored:
                  if not name.endswith('/'): assert a.read(name) == o.read(name)
              driver = 'Payload/AngelAuraAmethyst.app/Frameworks/libMobileGL.dylib'
              assert a.read(driver) == b.read(driver)
              for version in ('333','341'):
                  jar = f'Payload/AngelAuraAmethyst.app/libs/lwjgl-{version}/lwjgl.jar'
                  assert a.read(jar) == (Path(os.environ['GITHUB_WORKSPACE']) / f'source/JavaApp/build/lwjgl-{version}.jar').read_bytes()
                  with zipfile.ZipFile(io.BytesIO(a.read(jar))) as current, zipfile.ZipFile(io.BytesIO(b.read(jar))) as old:
                      assert current.testzip() is None
                      classes = lambda z: {i.filename for i in z.infolist() if i.filename.endswith('.class')}
                      assert classes(old).issubset(classes(current)), (version, sorted(classes(old)-classes(current)))
                      name = 'org/lwjgl/glfw/GLFW.class'
                      cls = current.read(name)
                      assert cls != old.read(name) and b'nglfwGetCreatedContextVersion' in cls
                      assert int.from_bytes(cls[6:8], 'big') == 52
              assert b'Ordered texture upload deferred: an earlier draw is still pending' in a.read(driver)
          for path in (out,overlay):
              print(path.name,hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PrismaCubic-f3bcab1-iPhone
          path: result/PrismaCubic-f3bcab1.ipa
          if-no-files-found: error
      - name: Save release checksum
        id: checksum
        run: |
          digest=$(shasum -a256 result/PrismaCubic-f3bcab1.ipa | cut -d ' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
    outputs:
      checksum: ${{ steps.checksum.outputs.digest }}
  publish:
    needs: build
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: PrismaCubic-f3bcab1-iPhone
          path: package
      - name: Publish verified separate test IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.build.outputs.checksum }}
        run: |
          set -euo pipefail
          ipa=PrismaCubic-f3bcab1.ipa
          tag=test-bettermc-gl-f3bcab1
          echo "$DIGEST  package/$ipa" | sha256sum -c -
          echo >> .github/bettermc-release.md
          echo "IPA SHA-256 \`$DIGEST\`" >> .github/bettermc-release.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$APP_REVISION" --title 'Better MC Forge launch · iPhone test' --prerelease --latest=false --draft --notes-file .github/bettermc-release.md
          fi
          asset_filter=".assets[] | select(.name==\"$ipa\") | .digest"
          existing=$(gh release view "$tag" --json assets --jq "$asset_filter")
          if [ -z "$existing" ]; then
            gh release upload "$tag" "package/$ipa"
          fi
          test "$(gh release view "$tag" --json assets --jq "$asset_filter")" = "sha256:$DIGEST"
          gh release edit "$tag" --draft=false --prerelease --latest=false
