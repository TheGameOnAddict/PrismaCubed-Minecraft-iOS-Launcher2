<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; media-src https:; style-src 'unsafe-inline'; form-action 'none'">
<style>
:root { color-scheme: dark; font: -apple-system-body; color: #e4e6eb; --accent: #58d899; }
body { margin: 0; }
article { display: flow-root; padding: 4px 16px 16px; line-height: 1.5; overflow-wrap: anywhere; }
article > :first-child { margin-top: 0; }
h1, h2, h3, h4 { line-height: 1.2; color: #fafafa; margin: 1.1em 0 .5em; }
p, ul, ol { margin: .65em 0; }
a { color: var(--accent); }
img, video, svg { max-width: 100%; height: auto; vertical-align: middle; }
figure { margin-inline: 0; }
pre, .table-scroll { overflow-x: auto; max-width: 100%; }
pre, code { background-color: #292b30; border-radius: 4px; }
pre { padding: .65em; }
blockquote { border-left: 3px solid #65696f; margin-inline: 0; padding-left: .9em; }
table { border-collapse: collapse; }
td, th { border: 1px solid #54575c; padding: .35em .6em; }
hr { border: 0; border-top: 1px solid #494c51; }
</style>
</head>
<body><article></article></body>
</html>
